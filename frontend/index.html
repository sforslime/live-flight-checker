<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Naija Flights | TravelAI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css">
    <!-- Flatpickr for custom date picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#581c87",
                        "primary-hover": "#4c1d75",
                        "background-light": "#f0f4f9",
                        "background-dark": "#131314",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e1f20",
                        "text-light": "#1f1f1f",
                        "text-dark": "#e3e3e3",
                        "subtext-light": "#444746",
                        "subtext-dark": "#c4c7c5",
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        sans: ["Outfit", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem',
                        '4xl': '2.5rem',
                    },
                    boxShadow: {
                        'soft': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
                        'floating': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                    }
                },
            },
        };
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-sans min-h-screen flex flex-col transition-colors duration-300">
    <nav class="w-full p-6 flex justify-between items-center">
        <div class="text-xl font-medium text-subtext-light dark:text-subtext-dark flex items-center gap-2">
            <span class="material-symbols-outlined sparkle-text text-3xl">auto_awesome</span>
            <span>Naija Flights</span>
        </div>
        <!-- Profile removed -->
    </nav>

    <main
        class="flex-grow flex flex-col items-center justify-start px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full pb-20 mt-10">
        <div class="w-full max-w-4xl mb-10 pl-2">
            <div class="flex items-center gap-2 mb-2">
                <h2 class="text-3xl font-medium sparkle-text tracking-tight">Hi Traveler</h2>
            </div>

            <h1 class="text-5xl md:text-6xl font-medium text-[#444746] dark:text-[#c4c7c5] tracking-tight mt-2">Where do
                you want to go?</h1>
        </div>

        <!-- Search Form -->
        <div
            class="w-full max-w-4xl bg-surface-light dark:bg-surface-dark rounded-4xl p-4 md:p-6 shadow-soft dark:shadow-none border border-transparent dark:border-gray-700 glow-border transition-all duration-300">
            <form id="search-form" class="flex flex-col gap-4">
                <div class="flex flex-col md:flex-row gap-3 w-full">
                    <!-- Origin -->
                    <div class="relative flex-1 group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span
                                class="material-icons text-subtext-light dark:text-subtext-dark opacity-50">flight_takeoff</span>
                        </div>
                        <select id="origin" name="origin"
                            class="appearance-none block w-full pl-12 pr-10 py-4 bg-background-light dark:bg-background-dark border-none rounded-2xl text-lg text-text-light dark:text-text-dark focus:ring-2 focus:ring-primary dark:focus:ring-primary/50 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <option value="LOS">Lagos (LOS)</option>
                            <option value="ABV">Abuja (ABV)</option>
                            <option value="KAN">Kano (KAN)</option>
                            <option value="PHC">Port Harcourt (PHC)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="material-icons text-subtext-light dark:text-subtext-dark">expand_more</span>
                        </div>
                    </div>

                    <!-- Destination -->
                    <div class="relative flex-1 group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span
                                class="material-icons text-subtext-light dark:text-subtext-dark opacity-50">flight_land</span>
                        </div>
                        <select id="destination" name="destination"
                            class="appearance-none block w-full pl-12 pr-10 py-4 bg-background-light dark:bg-background-dark border-none rounded-2xl text-lg text-text-light dark:text-text-dark focus:ring-2 focus:ring-primary dark:focus:ring-primary/50 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <option value="ABV" selected>Abuja (ABV)</option>
                            <option value="LOS">Lagos (LOS)</option>
                            <option value="KAN">Kano (KAN)</option>
                            <option value="PHC">Port Harcourt (PHC)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="material-icons text-subtext-light dark:text-subtext-dark">expand_more</span>
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="relative flex-[1.2] flex rounded-2xl overflow-hidden group">
                        <div
                            class="flex-grow relative bg-background-light dark:bg-background-dark hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <input id="date" name="date"
                                class="block w-full h-full pl-4 pr-4 py-4 bg-transparent border-none text-lg text-text-light dark:text-text-dark placeholder-subtext-light dark:placeholder-subtext-dark focus:ring-2 focus:ring-primary dark:focus:ring-primary/50"
                                placeholder="Departure Date" type="text" required />
                        </div>
                        <div id="calendar-btn"
                            class="bg-primary flex items-center justify-center w-16 min-w-[4rem] cursor-pointer">
                            <span class="material-icons text-white text-2xl">calendar_today</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mt-2 px-2">
                    <div class="flex items-center gap-4 text-subtext-light dark:text-subtext-dark">
                        <!-- Extra options (placeholders for now) -->
                        <button
                            class="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-sm font-medium"
                            type="button">
                            <span class="material-symbols-outlined text-lg">tune</span>
                            Filters
                        </button>
                    </div>
                    <button id="search-btn"
                        class="flex items-center gap-2 text-subtext-light dark:text-subtext-dark hover:text-primary dark:hover:text-primary-light transition-colors"
                        type="submit">
                        <span class="text-sm font-medium">Search Flights</span>
                        <span class="material-icons text-lg">arrow_forward</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Quick Filters/Chips (Visual only for now) -->
        <div class="w-full max-w-4xl mt-8 flex flex-wrap gap-3 px-2">
            <button
                class="flex items-center gap-2 px-5 py-3 bg-surface-light dark:bg-surface-dark rounded-full shadow-sm hover:bg-[#e6eaf0] dark:hover:bg-[#2a2b2e] transition-colors text-text-light dark:text-text-dark text-sm font-medium border border-gray-100 dark:border-gray-700">
                <span class="text-lg">🌴</span> Explore
            </button>
            <button
                class="flex items-center gap-2 px-5 py-3 bg-surface-light dark:bg-surface-dark rounded-full shadow-sm hover:bg-[#e6eaf0] dark:hover:bg-[#2a2b2e] transition-colors text-text-light dark:text-text-dark text-sm font-medium border border-gray-100 dark:border-gray-700">
                <span class="text-lg">⚡</span> Deals
            </button>
        </div>

        <!-- Results Section -->
        <div id="loading" class="hidden w-full max-w-4xl mt-10 flex flex-col items-center">
            <div class="spinner"></div>
            <p class="text-subtext-light">Scanning airlines for best fares...</p>
        </div>

        <div id="error-message"
            class="hidden w-full max-w-4xl mt-6 p-4 bg-red-100 dark:bg-red-900/20 text-red-600 rounded-2xl text-center">
        </div>

        <div id="results-area" class="w-full max-w-4xl mt-10 grid grid-cols-1 gap-4">
            <!-- Flight cards will be injected here -->
        </div>

    </main>

    <footer class="fixed bottom-4 right-4 text-xs text-subtext-light dark:text-subtext-dark opacity-40">
        AI-Powered Search • AYO!
    </footer>

    <script src="/static/app.js"></script>
</body>

</html>
